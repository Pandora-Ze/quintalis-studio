<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        body { 
            margin: 0; 
            background: #000; 
            font-family: sans-serif; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            user-select: none; 
            -webkit-user-select: none; 
        }
        .controls { padding: 10px; background: #111; display: flex; align-items: center; justify-content: center; gap: 15px; border-bottom: 1px solid #333; flex-wrap: wrap; z-index: 10; }
        label { font-size: 0.9em; color: #aaa; font-weight: bold; }
        select { background: #252525; color: white; border: 1px solid #444; padding: 8px; border-radius: 4px; outline: none; cursor: pointer; min-width: 200px; }
        .video-container { flex: 1; position: relative; width: 100%; background: #000; display: flex; justify-content: center; align-items: center; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Style du bouton avec icône */
        .btn-dl { 
            display: flex;
            align-items: center;
            gap: 8px;
            color: white; 
            text-decoration: none; 
            padding: 8px 15px; 
            border-radius: 4px; 
            font-size: 0.9em; 
            font-weight: bold; 
            transition: opacity 0.2s; 
        }
        .btn-dl img {
            height: 18px; /* Taille de l'icône Mega */
            width: auto;
            filter: brightness(0) invert(1); /* Force l'icône en blanc si besoin */
        }
        .btn-dl:hover { opacity: 0.8; }
        
        #error-screen { display: none; flex-direction: column; align-items: center; color: #e74c3c; text-align: center; padding: 20px; position: absolute; z-index: 20;}
        #error-screen .error-icon { font-size: 2.5em; margin-bottom: 10px; }
        #error-detail { color: #888; font-size: 0.85em; white-space: pre-line; margin-top: 10px;}
        #loader { position: absolute; font-size: 1.1em; color: #888; z-index: 20;}
    </style>
</head>
<body>
    <div class="controls" id="ui" style="display:none;">
        <label for="ep-select">ÉPISODE :</label>
        <select id="ep-select" onchange="changeVideo()"></select>
        <a id="dl-link" class="btn-dl" target="_blank">
            <img src="/static/mega.svg" alt="Mega"> TÉLÉCHARGER (MEGA)
        </a>
    </div>
    
    <div class="video-container">
        <div id="loader">Chargement des données...</div>
        <div id="error-screen">
            <div class="error-icon">⚠️</div>
            <strong>Impossible de charger les données vidéo.</strong>
            <p id="error-detail"></p>
        </div>
        <iframe id="video-player" src="" allowfullscreen style="display:none;"></iframe>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const animeId = urlParams.get('id');
        const themeColor = "#" + (urlParams.get('color') || "ff6b6b");
        
        const select = document.getElementById('ep-select');
        const player = document.getElementById('video-player');
        const dlLink = document.getElementById('dl-link');
        const ui = document.getElementById('ui');
        const loader = document.getElementById('loader');
        const errorScreen = document.getElementById('error-screen');
        const errorDetail = document.getElementById('error-detail');

        dlLink.style.background = themeColor;
        const style = document.createElement('style');
        style.innerHTML = `select:focus { border-color: ${themeColor} !important; }`;
        document.head.appendChild(style);

        function showError(msg) {
            loader.style.display = "none";
            ui.style.display = "none";
            player.style.display = "none";
            errorScreen.style.display = "flex";
            errorDetail.innerText = msg;
        }

        const jsonUrl = 'videos-data.json';

        fetch(jsonUrl)
            .then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status}\n${jsonUrl}`);
                return res.json();
            })
            .then(data => {
                if (data[animeId]) {
                    const episodes = data[animeId];
                    episodes.forEach((ep, index) => {
                        let opt = document.createElement('option');
                        opt.value = index;
                        opt.innerText = ep.title;
                        select.appendChild(opt);
                    });

                    window.changeVideo = function() {
                        const ep = episodes[select.value];
                        player.src = ep.url;
                        dlLink.href = ep.download;
                    };

                    loader.style.display = 'none';
                    ui.style.display = 'flex';
                    player.style.display = 'block';
                    changeVideo();
                } else {
                    showError(`Projet "${animeId}" introuvable dans videos-data.json.`);
                }
            })
            .catch(err => {
                showError(`Fichier inaccessible.\n${err.message}`);
            });
    </script>
</body>
</html>
