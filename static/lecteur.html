<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur Quintalis</title>
    <style>
        /* Reset & Base */
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #reader {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .img-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            transition: opacity 0.2s;
        }

        /* --- NOUVEAU DESIGN : Bouton Plein Écran Moderne --- */
        #fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); /* Effet Verre */
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 15;
            font-size: 1.3em;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }

            #fullscreen-btn:hover {
                transform: scale(1.1);
            }

        /* --- NOUVEAU DESIGN : Boutons Flottants (Pilules) --- */
        .controls-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 20;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
        }

        .control-pill {
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 10px 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

            .control-pill:hover {
                transform: translateY(-3px);
            }

        select {
            background: transparent;
            color: white;
            border: none;
            cursor: pointer;
            outline: none;
            font-size: 1em;
            font-weight: bold;
            text-align: center;
            appearance: none; /* Cache la flèche moche par défaut */
        }

            select option {
                background: #1a1a1a;
                color: white;
            }

        #page-info {
            color: #ddd;
            font-size: 1em;
            font-weight: bold;
            font-family: monospace;
            min-width: 60px;
            text-align: center;
        }

        /* --- MAGIE CSS : GESTION DU PLEIN ÉCRAN NATIVE --- */

        /* Quand le lecteur est en plein écran ET inactif (classe .idle) : On cache l'UI ! */
        #reader:fullscreen.idle .controls-container,
        #reader:-webkit-full-screen.idle .controls-container {
            transform: translate(-50%, 150%);
            opacity: 0;
            pointer-events: none;
        }

        #reader:fullscreen.idle #fullscreen-btn,
        #reader:-webkit-full-screen.idle #fullscreen-btn {
            opacity: 0;
            pointer-events: none;
        }

        /* Cache la souris PARTOUT en plein écran inactif */
        #reader:fullscreen.idle,
        #reader:fullscreen.idle *,
        #reader:-webkit-full-screen.idle,
        #reader:-webkit-full-screen.idle * {
            cursor: none !important;
        }

        /* Loaders & Ecrans d'erreur / Transition */
        .loader {
            border: 4px solid #333;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            position: absolute;
            z-index: 5;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #error-screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 12px;
            color: #e74c3c;
            font-size: 0.95em;
            text-align: center;
            padding: 20px;
        }

            #error-screen .error-icon {
                font-size: 2.5em;
            }

        #error-detail {
            color: #888;
            font-size: 0.85em;
            white-space: pre-line;
        }

        #transition-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.5em;
            text-align: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

            #transition-overlay.show {
                visibility: visible;
                opacity: 1;
            }

        #transition-text {
            margin-top: 20px;
            font-weight: bold;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="reader">
        <div id="loading-icon" class="loader"></div>
        <button id="fullscreen-btn" title="Plein écran (F)">⛶</button>

        <div class="img-container" id="click-zone">
            <img id="manga-page" src="" alt="Chargement..." style="opacity: 0;">
            <div id="error-screen">
                <div class="error-icon">⚠️</div>
                <strong>Impossible de charger les données du manga.</strong>
                <p id="error-detail"></p>
            </div>

            <div id="transition-overlay">
                <div class="loader" id="transition-loader" style="position: relative;"></div>
                <div id="transition-text">Chapitre suivant...</div>
            </div>
        </div>

        <div class="controls-container">
            <div class="control-pill" title="Choisir un chapitre">
                <select id="chapter-select"></select>
            </div>

            <div class="control-pill" title="Page actuelle">
                <span id="page-info">-- / --</span>
            </div>
        </div>
    </div>

    <script>
        let mangaData = null;
        let currentPages = [];
        let currentPage = 0;

        const img = document.getElementById('manga-page');
        const info = document.getElementById('page-info');
        const select = document.getElementById('chapter-select');
        const loader = document.getElementById('loading-icon');
        const errorScreen = document.getElementById('error-screen');
        const errorDetail = document.getElementById('error-detail');
        const transitionOverlay = document.getElementById('transition-overlay');
        const transitionText = document.getElementById('transition-text');
        const transitionLoader = document.getElementById('transition-loader');

        // --- 1. GESTION DE L'INACTIVITÉ ---
        const readerEl = document.getElementById('reader');
        const navBar = document.querySelector('.controls-container');
        let idleTimer;

        function isFullscreen() {
        return document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
        }

        function resetIdleTimer() {
        readerEl.classList.remove('idle');
        clearTimeout(idleTimer);

        if (isFullscreen()) {
        idleTimer = setTimeout(() => {
        readerEl.classList.add('idle');
        }, 2500);
        }
        }

        // Touches de clavier ignorées pour le réveil (sauf F qui gère l'écran)
        ['mousemove', 'mousedown', 'touchstart', 'fullscreenchange', 'webkitfullscreenchange'].forEach(evt => {
        document.addEventListener(evt, resetIdleTimer);
        });

        navBar.addEventListener('mouseenter', () => clearTimeout(idleTimer));
        navBar.addEventListener('mouseleave', resetIdleTimer);


        // --- 2. BOUTON PLEIN ÉCRAN ---
        function toggleFS() {
        if (!isFullscreen()) {
        if (readerEl.requestFullscreen) readerEl.requestFullscreen();
        else if (readerEl.webkitRequestFullscreen) readerEl.webkitRequestFullscreen();
        else if (readerEl.msRequestFullscreen) readerEl.msRequestFullscreen();
        } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
        }
        }
        document.getElementById('fullscreen-btn').onclick = toggleFS;


        // --- 3. CHARGEMENT MANGA ---
        const urlParams = new URLSearchParams(window.location.search);
        const mangaId = urlParams.get('id');
        const themeColor = "#" + (urlParams.get('color') || "3498db");

        function applyTheme() {
        loader.style.borderTopColor = themeColor;
        transitionLoader.style.borderTopColor = themeColor;

        // Applique la couleur dynamiquement au survol des nouveaux boutons
        const style = document.createElement('style');
        style.innerHTML = `
        .control-pill:hover { border-color: ${themeColor} !important; box-shadow: 0 10px 25px ${themeColor}55 !important; }
        #fullscreen-btn:hover { border-color: ${themeColor} !important; color: ${themeColor} !important; box-shadow: 0 8px 20px ${themeColor}55 !important; }
        select:focus { color: ${themeColor}; }
        `;
        document.head.appendChild(style);
        }

        function showError(msg) {
        loader.style.display = "none";
        img.style.display = "none";
        errorScreen.style.display = "flex";
        errorDetail.innerText = msg;
        }

        const jsonUrl = new URL('manga-data.json', window.location.href).href;

        fetch(jsonUrl)
        .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}\n${jsonUrl}`);
        return res.json();
        })
        .then(data => {
        if (data[mangaId]) {
        mangaData = data[mangaId];
        setupSelector();
        applyTheme();
        loadChapter(Object.keys(mangaData)[0]);
        } else {
        showError(`Projet "${mangaId}" introuvable dans manga-data.json.`);
        }
        })
        .catch(err => {
        showError(`Fichier manga-data.json inaccessible.\n${err.message}`);
        });

        function setupSelector() {
        select.innerHTML = "";
        Object.keys(mangaData).forEach(chNum => {
        let opt = document.createElement('option');
        opt.value = chNum;
        let title = mangaData[chNum].title ? " : " + mangaData[chNum].title : "";
        opt.innerText = "Ch. " + chNum + title;
        select.appendChild(opt);
        });
        select.onchange = (e) => loadChapter(e.target.value);
        }

        function loadChapter(chId, startAtEnd = false) {
        currentPages = Array.isArray(mangaData[chId]) ? mangaData[chId] : mangaData[chId].pages;
        currentPage = startAtEnd ? currentPages.length - 1 : 0;
        updateView();
        }

        function updateView() {
        loader.style.display = "block";
        img.style.opacity = "0";
        img.src = currentPages[currentPage];
        img.onload = () => {
        img.style.opacity = "1";
        loader.style.display = "none";
        };
        info.innerText = (currentPage + 1) + " / " + currentPages.length;
        if (currentPage < currentPages.length - 1) {
        const next = new Image();
        next.src = currentPages[currentPage + 1];
        }
        }

        // --- 4. ANIMATIONS DE TRANSITION ---
        function goToNextChapter() {
        const chapters = Object.keys(mangaData);
        const currentIndex = chapters.indexOf(select.value);

        if (currentIndex >= 0 && currentIndex < chapters.length - 1) {
        const nextChapterKey = chapters[currentIndex + 1];
        let nextTitle = mangaData[nextChapterKey].title ? "\n" + mangaData[nextChapterKey].title : "";

        transitionText.innerText = "Chapitre suivant\nCh. " + nextChapterKey + nextTitle;
        transitionOverlay.classList.add('show');

        setTimeout(() => {
        select.value = nextChapterKey;
        loadChapter(nextChapterKey);
        transitionOverlay.classList.remove('show');
        }, 1500);
        }
        }

        function goToPrevChapter() {
        const chapters = Object.keys(mangaData);
        const currentIndex = chapters.indexOf(select.value);

        if (currentIndex > 0) {
        const prevChapterKey = chapters[currentIndex - 1];
        let prevTitle = mangaData[prevChapterKey].title ? "\n" + mangaData[prevChapterKey].title : "";

        transitionText.innerText = "Chapitre précédent\nCh. " + prevChapterKey + prevTitle;
        transitionOverlay.classList.add('show');

        setTimeout(() => {
        select.value = prevChapterKey;
        loadChapter(prevChapterKey, true);
        transitionOverlay.classList.remove('show');
        }, 1500);
        }
        }

        // --- 5. NAVIGATION AU CLIC / CLAVIER ---
        document.getElementById('click-zone').onclick = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        if ((e.clientX - rect.left) > rect.width / 2) {
        if (currentPage < currentPages.length - 1) {
        currentPage++; updateView();
        } else {
        goToNextChapter();
        }
        } else {
        if (currentPage > 0) {
        currentPage--; updateView();
        } else {
        goToPrevChapter();
        }
        }
        };

        document.addEventListener('keydown', (e) => {
        if (e.key === "ArrowRight") {
        if (currentPage < currentPages.length - 1) {
        currentPage++; updateView();
        } else {
        goToNextChapter();
        }
        }
        if (e.key === "ArrowLeft") {
        if (currentPage > 0) {
        currentPage--; updateView();
        } else {
        goToPrevChapter();
        }
        }
        if (e.key === "f" || e.key === "F") { toggleFS(); }
        });
    </script>
</body>
</html>
