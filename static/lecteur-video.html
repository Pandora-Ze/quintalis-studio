<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecteur Quintalis — Vidéo</title>
<style>
:root {
  --bg: #050505;
  --bg2: rgba(15, 15, 15, 0.85);
  --bg3: #1a1a1a;
  --border: rgba(255, 255, 255, 0.1);
  --text: #ffffff;
  --text2: #a0a0a0;
  --accent: #ff6b6b;
  --radius: 8px;
  --topbar: 60px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* ══ TOPBAR (Avec effet Auto-Hide Cinematic) ══ */
#topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--topbar);
  background: var(--bg2);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  z-index: 100;
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
}

/* Cache la topbar quand la souris est inactive */
body.idle #topbar {
  transform: translateY(-100%);
  opacity: 0;
}
body.idle {
  cursor: none;
}

.anime-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
  letter-spacing: 0.5px;
}

.ep-badge {
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  white-space: nowrap;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.05);
  padding: 4px 10px;
  border-radius: 20px;
}
.ep-badge span { color: var(--accent); font-weight: 600; }

/* Sélecteur épisode Premium */
#ep-select {
  width: 180px;
  height: 36px;
  padding: 0 12px;
  background: rgba(25, 25, 25, 0.75);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  outline: none;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 10px center;
  background-size: 14px;
  padding-right: 32px;
  transition: all 0.25s ease;
}
#ep-select:hover, #ep-select:focus { 
  border-color: var(--accent); 
  background-color: rgba(40, 40, 40, 0.9);
}
#ep-select option { background: var(--bg); color: var(--text); padding: 10px; }

/* Boutons Navigation */
.ep-nav-btn {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  height: 36px;
  padding: 0 14px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
}
.ep-nav-btn span { font-size: 12px; color: var(--text2); transition: color 0.2s; }
.ep-nav-btn:hover:not(:disabled) { background: #2a2a2a; border-color: var(--accent); }
.ep-nav-btn:hover:not(:disabled) span { color: var(--text); }
.ep-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* Bouton téléchargement */
#dl-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 16px;
  border-radius: var(--radius);
  background: var(--accent);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transition: transform 0.15s, filter 0.15s;
}
#dl-btn:hover { filter: brightness(1.15); transform: scale(1.02); }
#dl-btn .dl-icon { height: 16px; filter: brightness(0) invert(1); }

/* Petits boutons icones */
.topbar-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text2);
  width: 36px;
  height: 36px;
  border-radius: var(--radius);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
}
.topbar-btn:hover { background: var(--bg3); color: var(--text); border-color: #555; }

/* ══ TRANSITION ÉCRAN NOIR ══ */
#transition-overlay {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
#transition-overlay.show { opacity: 1; pointer-events: all; }
#transition-text { font-size: 24px; font-weight: bold; color: var(--text); margin-bottom: 8px; }
#transition-sub { font-size: 16px; color: var(--accent); }

/* ══ VIDÉO ══ */
#video-wrap {
  position: fixed;
  top: 0;
  left: 0; right: 0; bottom: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
}
#video-player { width: 100%; height: 100%; border: none; display: none; }

/* ══ LOADER ET ERREUR ══ */
#loader {
  position: absolute; display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--text2); font-size: 14px; z-index: 20;
}
.spinner {
  width: 38px; height: 38px; border-radius: 50%; border: 3px solid #222; border-top-color: var(--accent); animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#error-screen {
  display: none; position: absolute; flex-direction: column; align-items: center; gap: 12px; color: #e74c3c; text-align: center; padding: 30px; font-size: 15px; z-index: 20;
}
#error-detail { color: var(--text2); font-size: 13px; white-space: pre-line; }

/* ══ TOAST NOTIFICATION ══ */
#toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(5px); border: 1px solid var(--accent);
  border-radius: 20px; padding: 10px 24px; font-size: 14px; font-weight: 500; color: #fff;
  opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 500; pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

/* ══ MODAL AIDE ══ */
#help-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(3px); z-index: 300; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
#help-modal.open { display: flex; opacity: 1; }
#help-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: min(420px, 90vw); box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateY(20px); transition: transform 0.3s; }
#help-modal.open #help-box { transform: translateY(0); }
#help-box h3 { font-size: 18px; margin-bottom: 20px; color: var(--accent); }
.shortcut-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
.shortcut-row:last-of-type { border-bottom: none; }
.shortcut-row .keys { display: flex; gap: 6px; align-items: center; }
kbd { background: var(--bg3); border: 1px solid #444; border-radius: 4px; padding: 3px 8px; font-family: monospace; font-size: 12px; color: #fff; box-shadow: 0 2px 0 #111; }
.shortcut-row .desc { color: var(--text2); }
#help-close { margin-top: 20px; width: 100%; height: 40px; background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius); cursor: pointer; font-size: 14px; font-weight: bold; transition: background 0.2s; }
#help-close:hover { background: var(--accent); border-color: var(--accent); }

@media (max-width: 768px) {
  .ep-nav-btn span { display: none; }
  .anime-title { font-size: 13px; }
  #ep-select { width: 140px; }
  #dl-btn .dl-label { display: none; }
  .ep-badge { display: none; }
}
</style>
</head>
<body>

<!-- TOPBAR PREMIUM -->
<header id="topbar">
  <div class="anime-title" id="anime-title-display">Chargement...</div>
  <div class="ep-badge">Épisode <span id="ep-badge-num">–</span></div>
  <button class="ep-nav-btn" id="btn-prev-ep" disabled>‹ <span>Précédent</span></button>
  <select id="ep-select"></select>
  <button class="ep-nav-btn" id="btn-next-ep" disabled><span>Suivant</span> ›</button>
  <a id="dl-btn" href="#" target="_blank" title="Télécharger sur MEGA">
    <svg class="dl-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    <span class="dl-label">Télécharger</span>
  </a>
  <button class="topbar-btn" id="btn-fs" title="Plein Écran">⛶</button>
  <button class="topbar-btn" id="btn-help" title="Raccourcis clavier">?</button>
</header>

<!-- TRANSITION OVERLAY -->
<div id="transition-overlay">
  <div id="transition-text">Chargement...</div>
  <div id="transition-sub"></div>
</div>

<!-- ZONE VIDÉO -->
<div id="video-wrap">
  <div id="loader"><div class="spinner"></div>Chargement des données…</div>
  <div id="error-screen">
    <div style="font-size:2.5em; margin-bottom:10px;">⚠️</div>
    <strong>Impossible de charger les données vidéo.</strong>
    <p id="error-detail"></p>
  </div>
  <iframe id="video-player" allowfullscreen></iframe>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- AIDE CLAVIER -->
<div id="help-modal">
  <div id="help-box">
    <h3>🎮 Raccourcis clavier</h3>
    <div class="shortcut-row"><span class="desc">Épisode suivant</span><span class="keys"><kbd>→</kbd> ou <kbd>N</kbd></span></div>
    <div class="shortcut-row"><span class="desc">Épisode précédent</span><span class="keys"><kbd>←</kbd> ou <kbd>P</kbd></span></div>
    <div class="shortcut-row"><span class="desc">Plein écran</span><span class="keys"><kbd>F</kbd></span></div>
    <div class="shortcut-row"><span class="desc">Cette aide</span><span class="keys"><kbd>?</kbd></span></div>
    <button id="help-close">Fermer</button>
  </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const animeId = urlParams.get('id');
const themeColor = '#' + (urlParams.get('color') || 'ff6b6b');
document.documentElement.style.setProperty('--accent', themeColor);

const epSelect = document.getElementById('ep-select');
const player = document.getElementById('video-player');
const dlBtn = document.getElementById('dl-btn');
const loader = document.getElementById('loader');
const errorScreen = document.getElementById('error-screen');
const errorDetail = document.getElementById('error-detail');
const btnPrev = document.getElementById('btn-prev-ep');
const btnNext = document.getElementById('btn-next-ep');
const epBadge = document.getElementById('ep-badge-num');
const animeTitleDisplay = document.getElementById('anime-title-display');
const toast = document.getElementById('toast');
const transitionOverlay = document.getElementById('transition-overlay');
const transitionText = document.getElementById('transition-text');
const transitionSub = document.getElementById('transition-sub');

let episodes = [];
let toastTimer;
let currentAnimeName = "Série";

function showError(msg) {
  loader.style.display = 'none';
  errorScreen.style.display = 'flex';
  errorDetail.innerText = msg;
}

function showToast(msg) {
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ══ CHARGEMENT DES DONNÉES AVEC PLAN B INTELLIGENT ══
const jsonUrl = new URL('videos-data.json', window.location.href).href + '?v=' + new Date().getTime();

fetch(jsonUrl)
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}\n${jsonUrl}`); return r.json(); })  .then(data => {
    if (!data[animeId]) { showError(`Projet "${animeId}" introuvable dans videos-data.json.`); return; }

    episodes = data[animeId];

    if (data._meta && data._meta[animeId] && data._meta[animeId].name) {
      currentAnimeName = data._meta[animeId].name;
    } else if (animeId) {
      currentAnimeName = animeId.split(/[-_]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }
    
    animeTitleDisplay.textContent = currentAnimeName;
    document.title = currentAnimeName + ' — Lecteur Quintalis';

    episodes.forEach((ep, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = ep.title;
      epSelect.appendChild(opt);
    });

    loader.style.display = 'none';
    player.style.display = 'block';

    // On charge le premier épisode sans transition
    loadEpisode(0, false);
  })
  .catch(err => showError(`Fichier inaccessible.\n${err.message}`));

// ══ LOGIQUE DE TRANSITION ET CHARGEMENT ══
function loadEpisode(index, useTransition = true) {
  if (index < 0 || index >= episodes.length) return;

  const ep = episodes[index];
  const applyData = () => {
    epSelect.value = index;
    player.src = ep.url;
    dlBtn.href = ep.download || '#';
    dlBtn.style.pointerEvents = ep.download ? '' : 'none';
    dlBtn.style.opacity = ep.download ? '' : '0.4';
    epBadge.textContent = index + 1;
    updateNavButtons(index);
  };

  if (useTransition) {
    transitionText.textContent = currentAnimeName;
    transitionSub.textContent = ep.title;
    transitionOverlay.classList.add('show');
    
    // Déclenche le changement pendant l'écran noir
    setTimeout(() => {
      applyData();
    }, 400);

    // Enlève l'écran noir
    setTimeout(() => {
      transitionOverlay.classList.remove('show');
    }, 1200);
  } else {
    applyData();
  }
}

function updateNavButtons(index) {
  btnPrev.disabled = index <= 0;
  btnNext.disabled = index >= episodes.length - 1;
}

epSelect.addEventListener('change', () => loadEpisode(parseInt(epSelect.value)));
btnPrev.addEventListener('click', () => goEp(-1));
btnNext.addEventListener('click', () => goEp(+1));

function goEp(dir) {
  const next = parseInt(epSelect.value) + dir;
  if (next < 0 || next >= episodes.length) return;
  loadEpisode(next);
  showToast(dir > 0 ? '▶ Épisode suivant' : '◀ Épisode précédent');
}

// ══ GESTION PLEIN ÉCRAN ET AUTO-HIDE (IDLE) ══
function toggleFS() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen();
  }
}
document.getElementById('btn-fs').addEventListener('click', toggleFS);

let idleTimer;
function resetIdle() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    // Ne cache la barre que si la souris n'est pas sur la topbar
    if (!document.querySelector('#topbar:hover') && !document.querySelector('#help-modal.open')) {
      document.body.classList.add('idle');
    }
  }, 2500);
}

// Détection des mouvements pour réveiller l'UI
document.addEventListener('mousemove', resetIdle, { passive: true });
document.addEventListener('mousedown', resetIdle, { passive: true });
document.addEventListener('keydown', resetIdle, { passive: true });
// Lancer le timer au démarrage
resetIdle();

// ══ AIDE ET RACCOURCIS ══
document.getElementById('btn-help').addEventListener('click', () => {
  document.getElementById('help-modal').classList.add('open');
});
document.getElementById('help-close').addEventListener('click', () => {
  document.getElementById('help-modal').classList.remove('open');
});
document.getElementById('help-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('help-modal'))
    document.getElementById('help-modal').classList.remove('open');
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') goEp(+1);
  if (e.key === 'ArrowLeft'  || e.key === 'p' || e.key === 'P') goEp(-1);
  if (e.key === 'f' || e.key === 'F') toggleFS();
  if (e.key === '?') document.getElementById('help-modal').classList.add('open');
  if (e.key === 'Escape') {
    if (document.getElementById('help-modal').classList.contains('open')) {
      document.getElementById('help-modal').classList.remove('open');
    }
  }
});
</script>
</body>
</html>
