<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur Quintalis</title>
    <style>
        /* Reset & Base */
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #reader {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .img-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            transition: opacity 0.2s;
        }

        /* Bouton Plein Écran */
        #fullscreen-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.4);
            color: white;
            border: 1px solid #444;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 15;
            font-size: 1.2em;
            transition: opacity 0.3s ease;
        }

        /* Barre Nav Base (Mode Normal : Toujours visible en bas) */
        .chapter-nav {
            height: 55px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: #111;
            width: 100%;
            justify-content: center;
            border-top: 1px solid #333;
            z-index: 20;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* ==== MAGIE CSS : GESTION DU PLEIN ÉCRAN NATIVE ==== */

        /* 1. Quand le lecteur passe en plein écran, la barre devient flottante */
        #reader:fullscreen .chapter-nav,
        #reader:-webkit-full-screen .chapter-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            background: rgba(17, 17, 17, 0.95);
            border-top: none;
        }

        /* 2. Quand le lecteur est en plein écran ET inactif (classe .idle) : On cache tout ! */
        #reader:fullscreen.idle .chapter-nav,
        #reader:-webkit-full-screen.idle .chapter-nav {
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }

        #reader:fullscreen.idle #fullscreen-btn,
        #reader:-webkit-full-screen.idle #fullscreen-btn {
            opacity: 0;
            pointer-events: none;
        }

        #reader:fullscreen.idle,
        #reader:-webkit-full-screen.idle {
            cursor: none; /* Cache la souris */
        }

        /* Reste de l'interface */
        select {
            background: #252525;
            color: white;
            border: 1px solid #444;
            padding: 5px;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
        }

        #page-info {
            color: #888;
            font-size: 0.85em;
            min-width: 80px;
            text-align: center;
            font-family: monospace;
        }

        .loader {
            border: 4px solid #333;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            position: absolute;
            z-index: 5;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #error-screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 12px;
            color: #e74c3c;
            font-size: 0.95em;
            text-align: center;
            padding: 20px;
        }

            #error-screen .error-icon {
                font-size: 2.5em;
            }

        #error-detail {
            color: #888;
            font-size: 0.85em;
            white-space: pre-line;
        }

        #transition-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.5em;
            text-align: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

            #transition-overlay.show {
                visibility: visible;
                opacity: 1;
            }

        #transition-text {
            margin-top: 20px;
            font-weight: bold;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="reader">
        <div id="loading-icon" class="loader"></div>
        <button id="fullscreen-btn" title="Plein écran (F)">⛶</button>

        <div class="img-container" id="click-zone">
            <img id="manga-page" src="" alt="Chargement..." style="opacity: 0;">
            <div id="error-screen">
                <div class="error-icon">⚠️</div>
                <strong>Impossible de charger les données du manga.</strong>
                <p id="error-detail"></p>
            </div>

            <div id="transition-overlay">
                <div class="loader" id="transition-loader" style="position: relative;"></div>
                <div id="transition-text">Chapitre suivant...</div>
            </div>
        </div>

        <div class="chapter-nav">
            <label for="chapter-select" style="font-size: 0.8em; color: #aaa;">Chapitre :</label>
            <select id="chapter-select"></select>
            <span id="page-info">-- / --</span>
        </div>
    </div>

    <script>
        let mangaData = null;
        let currentPages = [];
        let currentPage = 0;

        const img = document.getElementById('manga-page');
        const info = document.getElementById('page-info');
        const select = document.getElementById('chapter-select');
        const loader = document.getElementById('loading-icon');
        const errorScreen = document.getElementById('error-screen');
        const errorDetail = document.getElementById('error-detail');
        const transitionOverlay = document.getElementById('transition-overlay');
        const transitionText = document.getElementById('transition-text');
        const transitionLoader = document.getElementById('transition-loader');

        // --- 1. GESTION DE L'INACTIVITÉ SIMPLIFIÉE ---
        const readerEl = document.getElementById('reader');
        const navBar = document.querySelector('.chapter-nav');
        let idleTimer;

        // Fonction pour vérifier si on est en plein écran
        function isFullscreen() {
        return document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
        }

        function resetIdleTimer() {
        readerEl.classList.remove('idle');
        clearTimeout(idleTimer);

        // On ne déclenche le chronomètre de disparition QUE si on est en plein écran
        if (isFullscreen()) {
        idleTimer = setTimeout(() => {
        readerEl.classList.add('idle');
        }, 2500);
        }
        }

        // Relance le chrono sur toutes ces actions
        ['mousemove', 'mousedown', 'touchstart', 'keydown', 'fullscreenchange', 'webkitfullscreenchange'].forEach(evt => {
        document.addEventListener(evt, resetIdleTimer);
        });

        // Bloque la disparition si la souris est sur la barre
        navBar.addEventListener('mouseenter', () => clearTimeout(idleTimer));
        navBar.addEventListener('mouseleave', resetIdleTimer);


        // --- 2. BOUTON PLEIN ÉCRAN ---
        function toggleFS() {
        if (!isFullscreen()) {
        if (readerEl.requestFullscreen) readerEl.requestFullscreen();
        else if (readerEl.webkitRequestFullscreen) readerEl.webkitRequestFullscreen();
        else if (readerEl.msRequestFullscreen) readerEl.msRequestFullscreen();
        } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
        }
        }
        document.getElementById('fullscreen-btn').onclick = toggleFS;


        // --- 3. CHARGEMENT MANGA (Code Claude) ---
        const urlParams = new URLSearchParams(window.location.search);
        const mangaId = urlParams.get('id');
        const themeColor = "#" + (urlParams.get('color') || "3498db");

        function applyTheme() {
        loader.style.borderTopColor = themeColor;
        transitionLoader.style.borderTopColor = themeColor;
        const style = document.createElement('style');
        style.innerHTML = `
        select:focus { border-color: ${themeColor} !important; }
        #fullscreen-btn:hover { background: ${themeColor}CC !important; border-color: ${themeColor} !important; }
        `;
        document.head.appendChild(style);
        }

        function showError(msg) {
        loader.style.display = "none";
        img.style.display = "none";
        errorScreen.style.display = "flex";
        errorDetail.innerText = msg;
        }

        // Ligne de Claude pour éviter le bug d'URL relative !
        const jsonUrl = new URL('manga-data.json', window.location.href).href;

        fetch(jsonUrl)
        .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}\n${jsonUrl}`);
        return res.json();
        })
        .then(data => {
        if (data[mangaId]) {
        mangaData = data[mangaId];
        setupSelector();
        applyTheme();
        loadChapter(Object.keys(mangaData)[0]);
        } else {
        showError(`Projet "${mangaId}" introuvable dans manga-data.json.`);
        }
        })
        .catch(err => {
        showError(`Fichier manga-data.json inaccessible.\n${err.message}`);
        });

        function setupSelector() {
        select.innerHTML = "";
        Object.keys(mangaData).forEach(chNum => {
        let opt = document.createElement('option');
        opt.value = chNum;
        let title = mangaData[chNum].title ? " : " + mangaData[chNum].title : "";
        opt.innerText = "Ch. " + chNum + title;
        select.appendChild(opt);
        });
        select.onchange = (e) => loadChapter(e.target.value);
        }

        function loadChapter(chId) {
        currentPages = Array.isArray(mangaData[chId]) ? mangaData[chId] : mangaData[chId].pages;
        currentPage = 0;
        updateView();
        }

        function updateView() {
        loader.style.display = "block";
        img.style.opacity = "0";
        img.src = currentPages[currentPage];
        img.onload = () => {
        img.style.opacity = "1";
        loader.style.display = "none";
        };
        info.innerText = (currentPage + 1) + " / " + currentPages.length;
        if (currentPage < currentPages.length - 1) {
        const next = new Image();
        next.src = currentPages[currentPage + 1];
        }
        }

        function goToNextChapter() {
        const chapters = Object.keys(mangaData);
        const currentIndex = chapters.indexOf(select.value);

        if (currentIndex >= 0 && currentIndex < chapters.length - 1) {
        const nextChapterKey = chapters[currentIndex + 1];
        let nextTitle = mangaData[nextChapterKey].title ? "\n" + mangaData[nextChapterKey].title : "";

        transitionText.innerText = "Chapitre suivant\nCh. " + nextChapterKey + nextTitle;
        transitionOverlay.classList.add('show');

        setTimeout(() => {
        select.value = nextChapterKey;
        loadChapter(nextChapterKey);
        transitionOverlay.classList.remove('show');
        }, 1500);
        }
        }

        // --- 4. NAVIGATION AU CLIC / CLAVIER ---
        document.getElementById('click-zone').onclick = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        if ((e.clientX - rect.left) > rect.width / 2) {
        if (currentPage < currentPages.length - 1) {
        currentPage++; updateView();
        } else {
        goToNextChapter();
        }
        } else {
        if (currentPage > 0) { currentPage--; updateView(); }
        }
        };

        document.addEventListener('keydown', (e) => {
        if (e.key === "ArrowRight") {
        if (currentPage < currentPages.length - 1) {
        currentPage++; updateView();
        } else {
        goToNextChapter();
        }
        }
        if (e.key === "ArrowLeft") { if (currentPage > 0) { currentPage--; updateView(); } }
        if (e.key === "f" || e.key === "F") { toggleFS(); }
        });
    </script>
</body>
</html>
